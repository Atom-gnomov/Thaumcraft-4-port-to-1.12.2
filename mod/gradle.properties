# ForgeGradle 2.3 requires Gradle 4.x
org.gradle.jvmargs=-Xmx2G -XX:+HeapDumpOnOutOfMemoryError

# Parallel compilation across modules and within a single project
org.gradle.parallel=true
org.gradle.workers.max=4

# Build cache: reuse task outputs across clean builds
org.gradle.caching=true

# Incremental Java compilation
org.gradle.java.compile.incremental=true

org.gradle.daemon=false

# The build needs a JDK 8 (Gradle 4.10.3 + ForgeGradle 2.3 do not run on newer
# Java, and the JDK must be a JDK, not a JRE, for tools.jar).
#
# org.gradle.java.home is deliberately NOT set here: it used to be committed
# with one machine's absolute path, which broke the build for everyone else.
# Point at your own JDK 8 one of these two ways:
#
#   * per invocation:  ./gradlew build -Dorg.gradle.java.home=../../tools/jdk8u492-b09
#   * once per machine: add org.gradle.java.home=<path> to ~/.gradle/gradle.properties
#
# The repo's own copy lives at ../tools/jdk8u492-b09 relative to the repo root.
